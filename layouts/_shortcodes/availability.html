{{- $roles := .Get "roles" -}}
{{- if not $roles -}}
	{{- errorf "The %q shortcode requires a roles parameter: %s" .Name .Position -}}
{{- end -}}
<p class="mu-availability"><i class="fa fa-user" aria-hidden="true"></i><span>Available to: </span><span class="mu-availability__roles">{{ $roles }}</span></p>
