{{ define "main" }}
<main class="mu-page mu-release-list container-fluid td-outer" role="main">
  <div class="row justify-content-center"><div class="col-12 col-lg-9 col-xl-10">
    <header class="mu-page-header">
	  <a class="mu-release-back" href="{{ .Site.Home.RelPermalink }}"><span aria-hidden="true">&larr;</span> Mucklet Docs</a>
      <p class="mu-eyebrow"></p>
      <h1>{{ .Title }}</h1>
      {{ with .Content }}<div class="mu-page-summary">{{ . }}</div>{{ end }}
    </header>
    <div class="mu-release-list__items">
      {{ range .RegularPages.ByDate.Reverse }}
      <article class="mu-release-card mu-release-card--link">
        <a class="mu-release-card__link" href="{{ .RelPermalink }}" aria-label="Read {{ .Title }}"></a>
        <p class="mu-release-card__meta">{{ with .Params.release }}{{ . }} · {{ end }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></p>
        <h2>{{ .Title }}</h2>
        {{ with .Description }}<p>{{ . }}</p>{{ end }}
      </article>
      {{ end }}
    </div>
  </div></div>
</main>
{{ end }}
