baseURL = "https://docs.mucklet.com/"
title = "Mucklet Docs"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableGitInfo = true
disableKinds = ["taxonomy", "term"]

[languages]
  [languages.en]
    label = "English"
    contentDir = "content/en"
    weight = 1

[params]
  description = "Official guides, release notes, and scripting resources for Mucklet."
  mainSiteURL = "https://mucklet.com/"
  github_repo = "https://github.com/mucklet/mucklet-docs"

  [params.ui]
    sidebar_menu_compact = true
    sidebar_search_disable = true
    breadcrumb_disable = true
    navbar_logo = false
    ul_show = 1

  [params.ui.feedback]
    enable = false

  [params.ui.readingtime]
    enable = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    style = "monokai"
    noClasses = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[module]
  proxy = "direct"
  [module.hugoVersion]
    extended = true
    min = "0.160.1"
  [[module.imports]]
    path = "github.com/google/docsy/theme"
