name: Build and deploy docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install Hugo Extended
        run: |
          curl --fail --location --output hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo install hugo /usr/local/bin/hugo
      - name: Install frontend dependencies
        run: npm ci
      - name: Build production site
        run: hugo --minify --environment production
      - name: Check generated site
        run: test -f public/index.html && test -f public/releases/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public/
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production-docs
      url: https://docs.mucklet.com
    concurrency:
      group: production-docs
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public
      - name: Check deployment configuration
        id: deploy-config
        env:
          HOST: ${{ secrets.DOCS_DEPLOY_HOST }}
          USER: ${{ secrets.DOCS_DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DOCS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DOCS_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: DOCS_DEPLOY_HOST is not configured."
            exit 0
          fi
          test -n "$USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        if: steps.deploy-config.outputs.configured == 'true'
        env:
          SSH_KEY: ${{ secrets.DOCS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DOCS_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Install SFTP deployment client
        if: steps.deploy-config.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lftp
      - name: Publish static files
        if: steps.deploy-config.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.DOCS_DEPLOY_HOST }}
          USER: ${{ secrets.DOCS_DEPLOY_USER }}
        run: |
          lftp <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set sftp:auto-confirm no
          set sftp:connect-program "ssh -F /dev/null -a -x -i ${HOME}/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${HOME}/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null"
          open -u "$USER" "sftp://$HOST"
          mirror --reverse --delete --verbose public/ /current/
          bye
          EOF
